[package]
name = "digipet-tools"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
cap-std = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.29", default-features = false }
ignore = "0.4"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tempfile = "3"
