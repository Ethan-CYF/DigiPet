name: Build desktop pet
on:
  push:
    branches: [main, feat/m5-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.58.2 supports Noble; ubuntu-latest can select unsupported Ubuntu 26.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tools-core -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config file libxdo-dev libx11-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --manifest-path tools-core/Cargo.toml
      - name: Repository credential-pattern scan
        run: node scripts/check-secrets.mjs
      - run: pnpm build
      - name: Unit and interaction tests (mock APIs only)
        run: pnpm test
      - name: Mock model through real Rust tools
        run: pnpm test:tools
      - name: Browser setup, chat, tools and appearance smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Performance and browser evidence
        uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: M5-performance-${{ runner.os }}
          path: test-results/
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # M4 verifies native binaries without release-only NSIS/AppRun downloads.
      - name: Build native application
        run: pnpm tauri build --no-bundle
      - name: Build unsigned installers (manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          pnpm tauri build 2>&1 | tee installer-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            node -e 'const fs = require("node:fs"); const tail = fs.readFileSync("installer-build.log", "utf8").replace(/\u001b\[[0-9;]*m/g, "").trim().split(/\r?\n/).slice(-35).join("\n"); console.log("::error title=Installer build failure::" + tail.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"));'
          fi
          exit "$result"
      - name: Linux X11 startup smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 8s src-tauri/target/release/digipet > native-smoke.log 2>&1
          result=$?
          cat native-smoke.log
          test "$result" -eq 124
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: DigiPet-${{ runner.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
